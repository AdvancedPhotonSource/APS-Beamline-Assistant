[project]
name = "beamline-assistant"
version = "2.0.0"
description = "APEXA - Advanced Photon EXperiment Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core
    "httpx>=0.28.1",
    "mcp>=1.14.1",
    "python-dotenv>=1.1.1",
    # Web UI
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
    "python-multipart>=0.0.20",
    # Gradio UI
    "gradio>=6.3.0",
    # Scientific
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "fabio>=2024.9.0",
    "tifffile>=2024.1.0",
    "xrayutilities>=1.7.12",
    "h5py>=3.11.0",
    "pillow>=11.3.0",
    "pandas>=2.3.2",
    # Knowledge base / RAG
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pypdf2>=3.0.0",
    "mp-api>=0.41.0",
]
