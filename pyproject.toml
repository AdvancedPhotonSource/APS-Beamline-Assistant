[project]
name = "beamline-assistant"
version = "2.0.0"
description = "APEXA - Advanced Photon EXperiment Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core
    "httpx>=0.28.1",
    "mcp>=1.14.1",
    "python-dotenv>=1.1.1",
    # Web UI
    "fastapi>=0.116.2",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
    "python-multipart>=0.0.20",
    # Gradio UI
    "gradio>=6.3.0",
    # Scientific
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "fabio>=2024.9.0",
    "tifffile>=2024.1.0",
    "xrayutilities>=1.7.12",
    "h5py>=3.11.0",
    "zarr>=2.18.0,<3",
    "pillow>=11.3.0",
    "pandas>=2.3.2",
    # Trame Web UI
    "trame>=3.6.0",
    "trame-vuetify>=2.7.0",
    "trame-plotly>=3.0.0",
    "trame-components>=2.4.0",
    # CLI
    "prompt-toolkit>=3.0.0",
    "psutil>=5.9.0",  # kill a server's process tree on Ctrl-C abort (cross-platform)
    # Knowledge base / RAG
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pypdf2>=3.0.0",
    # read_document parsers (graceful zip+XML fallback if any are missing)
    "pypdf>=4.0.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "mp-api>=0.41.0",
    "dspy>=3.2.0",
    "autogen-agentchat>=0.7.5",
    "autogen-ext>=0.7.5",
    "einops>=0.8.2",
    # MIDAS native stack (midas-index, midas-fit-grain, ...) compiles C/C++/CUDA and
    # has no Windows wheels — skip it on native Windows so `uv sync` installs cleanly
    # (CLI/agent/core work; run MIDAS HEDM tools under WSL2/Linux). Unchanged elsewhere.
    "midas-suite[ff,pdf,defect,dfxm,xaf,ultrafast,grain-odf,pf-odf,pink]>=0.4.0 ; sys_platform != 'win32'",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# Extra scientific packages (not currently imported but useful for future)
extra = [
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
    "scikit-image>=0.25.2",
    "pyfai>=2025.3.0",
    "lmfit>=1.3.4",
    "vtk>=9.3.0",
    "trame-vtk>=2.8.0",
    "rich>=14.1.0",
    "typer>=0.17.4",
    "orjson>=3.11.3",
]
